version: '3.8'

services:
  # 1. MQTT Broker (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: farm_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - farm_network

  # 2. Local Web App + Automation Engine (FastAPI + SQLite)
  farm_webapp:
    build: ./farm-web-app
    container_name: farm_webapp
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - TZ=Asia/Bangkok
    depends_on:
      - mosquitto
    networks:
      - farm_network

networks:
  farm_network:
    driver: bridge
